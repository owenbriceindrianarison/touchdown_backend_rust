[package]
name = "shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }

pasetors = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true }

async-nats = { workspace = true }

sqlx = { workspace = true }

hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

dotenvy = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

# --- optionals ---
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
# testcontainers = { workspace = true }
# testcontainers-modules = {workspace = true }


[features]
default = []
# Export OTLP. Gated behind a feature: the opentelemetry ecosystem breaks its
# API at every minor version, so we don't want it to block the whole build.
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
# Testcontainers fixtures, enabled by services in dev-dependencies.
# testing = ["dep:testcontainers"]
