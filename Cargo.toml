[workspace]
resolver = "3"
members = ["crates/*", "services/*"]


[workspace.package]
name = "touchdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
shared = { path = "crates/shared" }

# --- HTTP ---
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower = { version = "0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = [
    "cors",
    "trace",
    "compression-gzip",
    "request-id",
    "timeout",
] }
hyper = "1.11.0"

# ======== Messaging ========
async-nats = "0.50.0"

thiserror = "2.0.20"
anyhow = "1.0.104"

# ========= Serialization =============
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# ========= Observability =============
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", feature = [
    "env-filter",
    "json",
    "fmt",
] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"] }

# ========== persistence ==============
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
